version: '3.8'

# =============================================================================
# Docker Compose - Intelligent Book Management System
# =============================================================================
# REQUIRED: Copy ../.env.example to ../.env and configure before running.
#
# Usage:
#   docker-compose --env-file ../.env up -d
#
# Note: All sensitive values (passwords, secrets) MUST be set via environment.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:15
    container_name: intelligent_books_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-intelligent_books_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - book-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-intelligent_books_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # FastAPI Application
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: intelligent_books_api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      # Database - constructed from env vars
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-intelligent_books_db}
      
      # Security - REQUIRED
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      
      # AI Configuration
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-meta-llama/llama-3-8b-instruct:free}
      LLAMA_MODEL_PATH: ${LLAMA_MODEL_PATH:-microsoft/DialoGPT-medium}
      LLAMA_MAX_LENGTH: ${LLAMA_MAX_LENGTH:-512}
      
      # LLM Generation Parameters (must match settings.py names)
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.7}
      LLM_TOP_P: ${LLM_TOP_P:-0.9}
      LLM_MAX_TOKENS_SUMMARY: ${LLM_MAX_TOKENS_SUMMARY:-150}
      LLM_MAX_TOKENS_RECOMMENDATION: ${LLM_MAX_TOKENS_RECOMMENDATION:-200}
      
      # JWT Configuration
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      
      # Application
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      
      # Redis Cache - uses internal Docker network
      REDIS_URL: redis://redis:6379/0
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - book-network
    volumes:
      - ../:/app
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Redis Cache (for recommendations and AI summaries)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: intelligent_books_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - book-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

volumes:
  postgres_data:
    name: intelligent_books_postgres_data
  redis_data:
    name: intelligent_books_redis_data

networks:
  book-network:
    name: intelligent_books_network
    driver: bridge
